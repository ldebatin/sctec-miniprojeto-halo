spring:
  application:
    name: halo-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/halo}
    username: ${SPRING_DATASOURCE_USERNAME:halo}
    password: ${SPRING_DATASOURCE_PASSWORD:halo}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

resilience4j:
  # Política de envio ao Evolution Go (T-012, RF-04). 3 tentativas com backoff
  # exponencial 1s/3s/9s em 5xx ou IOException; 4xx falha imediatamente.
  # CB abre após 5 falhas consecutivas (5xx/IO), meio-aberto após 30s.
  #
  # Aspect order: invertemos o default (Retry outer, CB inner) para que cada
  # sendText() conte como UMA chamada do CB — assim "5 falhas consecutivas"
  # significa 5 sendText falhando, não 5 retries.
  retry:
    retry-aspect-order: 400
    instances:
      evolution:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 3
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
  circuitbreaker:
    circuit-breaker-aspect-order: 300
    instances:
      evolution:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 100
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

halo:
  report:
    quickchart:
      # Endpoint público da QuickChart (analise-tecnica §9.3, Opção A).
      # Em testes pode apontar para um mock; em produção pode ser uma
      # instância self-hosted (quickchart.io tem imagem docker).
      base-url: ${QUICKCHART_BASE_URL:https://quickchart.io}
      # Timeout duro da chamada (RF-15). Falha → fallback texto-only.
      timeout: ${QUICKCHART_TIMEOUT:5s}
  security:
    # Origens autorizadas pelo CORS (analise-tecnica §10.3). Lista
    # separada por vírgula. Default cobre o Vite dev server local; em
    # produção injetar via HALO_SECURITY_CORS_ALLOWED_ORIGINS.
    cors-allowed-origins: ${HALO_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    jwt:
      # Segredo HMAC-SHA256 do access token (analise-tecnica §10.2). Base64
      # de pelo menos 32 bytes. Default só vale para dev/teste — em
      # produção é obrigatório injetar via HALO_AUTH_JWT_SECRET.
      secret: ${HALO_AUTH_JWT_SECRET:ZGV2LWp3dC1zZWNyZXQtY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tMDAxMQ==}
      # TTL do access token. Refresh token tem 30 dias e é configurado em
      # RefreshTokenService (não tem motivo para sobrescrever em runtime).
      access-token-ttl: PT15M
      issuer: halo
  gemini:
    # Chave da API Google AI Studio (lida do .env em dev).
    api-key: ${GEMINI_API_KEY:}
    # Endpoint REST do Google AI (não confundir com Vertex AI).
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    # Modelo default — analise-tecnica §9.1.
    model: ${GEMINI_MODEL:gemini-2.5-flash}
  evolution:
    # GLOBAL_API_KEY do Evolution Go (mesmo valor do container em infra/.env).
    # Usado quando o backend chama os endpoints GLOBAIS do Evolution.
    # O webhook que CHEGA no backend (POST /webhooks/evolution) NÃO usa essa
    # chave — o Evolution Go self-hosted não envia auth em webhooks de saída.
    api-key: ${EVOLUTION_API_KEY:}
    # URL base do Evolution Go que o backend usa ao ENVIAR mensagens.
    # Em dev local com compose: http://localhost:8081 (default na infra/.env).
    # Em produção: URL interna do Evolution na rede docker.
    base-url: ${EVOLUTION_BASE_URL:http://localhost:8081}
    # Instância criada via Manager UI (nome do bot — default: halo-bot).
    instance: ${EVOLUTION_INSTANCE:halo-bot}
    # Token da instância (retornado em POST /instance/create), usado em
    # endpoints por-instância como /message/sendText/{instance}. Ver CLAUDE.md.
    instance-token: ${EVOLUTION_INSTANCE_TOKEN:}
