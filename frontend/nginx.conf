# Halo frontend — nginx config dev/staging.
# Versão produção (cache headers agressivos, brotli, CSP, redirects HTTPS)
# entra em T-046 + T-047 (atrás do Traefik).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: rotas do React Router caem no index.html (sem 404).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker do vite-plugin-pwa: nunca cachear, sempre buscar a versão nova.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
}
