name: halo

services:
  postgres:
    image: postgres:16
    container_name: halo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-halo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-halo}
      POSTGRES_DB: ${POSTGRES_DB:-halo}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - halo-pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-halo} -d ${POSTGRES_DB:-halo}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - halo-net

  evolution-go:
    image: evoapicloud/evolution-go:latest
    container_name: halo-evolution-go
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      CLIENT_NAME: ${EVOLUTION_CLIENT_NAME:-halo}
      GLOBAL_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY em infra/.env}
      OS_NAME: "Halo Bot"
      CONNECT_ON_STARTUP: "false"
      WADEBUG: "INFO"
      LOGTYPE: "console"
      DATABASE_SAVE_MESSAGES: "true"
      POSTGRES_AUTH_DB: postgresql://${POSTGRES_USER:-halo}:${POSTGRES_PASSWORD:-halo}@postgres:5432/evogo_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://${POSTGRES_USER:-halo}:${POSTGRES_PASSWORD:-halo}@postgres:5432/evogo_users?sslmode=disable
      WEBHOOK_URL: ${EVOLUTION_WEBHOOK_URL:-}
      WEBHOOK_FILES: "false"
      AMQP_GLOBAL_ENABLED: "false"
      MINIO_ENABLED: "false"
    ports:
      - "${EVOLUTION_HOST_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/swagger/index.html"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - halo-net

  # ---------------------------------------------------------------------------
  # Serviços do profile `app` — opt-in via `docker compose --profile app up -d`.
  # Default (`docker compose up -d`) sobe só infra (postgres + evolution-go),
  # mantendo backend/frontend rodando localmente com mvn / npm e hot-reload.
  # ---------------------------------------------------------------------------

  backend:
    profiles: ["app"]
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: halo-backend:dev
    container_name: halo-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-halo}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-halo}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-halo}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    networks:
      - halo-net

  frontend:
    profiles: ["app"]
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # URL da API acessada pelo BROWSER (fora da rede docker).
        # Quando o backend roda no compose com ports 8080:8080, o browser
        # alcança via http://localhost:8080.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    image: halo-frontend:dev
    container_name: halo-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    networks:
      - halo-net

volumes:
  halo-pgdata:
    name: halo-pgdata

networks:
  halo-net:
    name: halo-net
    driver: bridge
